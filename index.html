<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tote Cards Preview Index</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, sans-serif;
      background: #f6f5f1;
      color: #202020;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; }
    header {
      padding: 24px 28px 16px;
      background: #2c3e2d;
      color: #f4f0e6;
      border-bottom: 1px solid rgba(0,0,0,0.08);
    }
    header h1 { margin: 0 0 8px; font-size: 1.8rem; }
    header p { margin: 0; opacity: 0.85; max-width: 54rem; line-height: 1.5; }
    .grid {
      display: grid;
      gap: 24px;
      padding: 24px;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    }
    .card {
      background: #ffffff;
      border: 1px solid rgba(44,62,45,0.12);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      min-height: 520px;
    }
    .card-header {
      padding: 20px 22px 16px;
      border-bottom: 1px solid rgba(44,62,45,0.08);
      background: #f4f0e6;
    }
    .card-header h2 { margin: 0 0 6px; font-size: 1.1rem; }
    .card-header p { margin: 0; opacity: 0.75; font-size: 0.95rem; line-height: 1.4; }
    .frame-wrap {
      position: relative;
      flex: 1;
      min-height: 320px;
      background: #faf7f0;
      border-bottom: 1px solid rgba(44,62,45,0.08);
    }
    .frame-wrap::before {
      content: "Preview";
      position: absolute;
      top: 12px;
      left: 14px;
      z-index: 2;
      padding: 4px 10px;
      background: rgba(255,255,255,0.92);
      color: #2c3e2d;
      border-radius: 999px;
      font-size: 0.77rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      padding: 18px 22px 24px;
      align-items: center;
    }
    .actions a,
    .actions button {
      text-decoration: none;
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 10px 18px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }
    .actions a {
      color: #2c3e2d;
      background: #f4f0e6;
      border-color: rgba(44,62,45,0.16);
    }
    .actions a:hover,
    .actions button:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 24px rgba(44,62,45,0.08);
    }
    .actions button {
      background: #4a7c59;
      color: #fff;
      border-color: #4a7c59;
    }
    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(28,32,28,0.94);
      color: #f4f0e6;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s ease;
      font-size: 0.95rem;
    }
    .toast.visible { opacity: 1; }
    .note {
      margin: 0;
      padding: 16px 22px 18px;
      background: #fff8e1;
      color: #2c3e2d;
      border-top: 1px solid rgba(44,62,45,0.08);
      font-size: 0.95rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <header>
    <h1>Tote Cards Preview Index</h1>
    <p>Preview every tote card design in iframes, open any page in a new browser tab, or copy the raw HTML source to your clipboard.</p>
  </header>

  <div class="grid" id="previewGrid"></div>
  <div class="note">Tip: If clipboard copy does not work from file://, open this index through a local web server for full clipboard support.</div>
  <div class="toast" id="toast"></div>

  <script>
    const files = [
      { title: 'Ouachita — Renter', path: 'ouachita/b40_ouachita_renter.html' },
      { title: 'Ouachita — Tech', path: 'ouachita/b40_ouachita_tech.html' },
      { title: 'Ouachita — Kit Sheet', path: 'ouachita/ouachita_kit_sheet.html' },
      { title: 'Ridgeline — Renter', path: 'ridgeline/b40_ridgeline_renter.html' },
      { title: 'Ridgeline — Tech', path: 'ridgeline/b40_ridgeline_tech.html' },
      { title: 'Ridgeline — Kit Sheet', path: 'ridgeline/ridgeline_pack_kit_sheet.html' },
      { title: 'River Valley — Renter', path: 'river-valley-pack/b40_river-valley-pack_renter.html' },
      { title: 'River Valley — Tech', path: 'river-valley-pack/b40_river-valley-pack_tech.html' },
      { title: 'River Valley — Kit Sheet', path: 'river-valley-pack/river_valley_pack_kit_sheet.html' },
      { title: 'Shared — Fulfillment Tech', path: 'b40_fulfillment_tech_card.html' },
      { title: 'Shared — Renter Checklist', path: 'b40_renter_checklist_card.html' }
    ];

    const grid = document.getElementById('previewGrid');
    const toast = document.getElementById('toast');

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('visible');
      window.clearTimeout(toast.dismissTimeout);
      toast.dismissTimeout = window.setTimeout(() => {
        toast.classList.remove('visible');
      }, 2200);
    }

    async function copyFile(path) {
      try {
        const response = await fetch(path, { cache: 'no-store' });
        if (!response.ok) throw new Error('Unable to load file');
        const text = await response.text();
        await navigator.clipboard.writeText(text);
        showToast(`Copied raw HTML: ${path}`);
      } catch (error) {
        console.error(error);
        showToast('Copy failed. Try opening via a local server.');
      }
    }

    files.forEach(item => {
      const card = document.createElement('article');
      card.className = 'card';

      const header = document.createElement('div');
      header.className = 'card-header';
      header.innerHTML = `<h2>${item.title}</h2><p>${item.path}</p>`;

      const frameWrap = document.createElement('div');
      frameWrap.className = 'frame-wrap';
      const frame = document.createElement('iframe');
      frame.src = item.path;
      frame.title = item.title;
      frameWrap.appendChild(frame);

      const actions = document.createElement('div');
      actions.className = 'actions';
      const openLink = document.createElement('a');
      openLink.href = item.path;
      openLink.target = '_blank';
      openLink.rel = 'noopener noreferrer';
      openLink.textContent = 'Open in browser';

      const copyButton = document.createElement('button');
      copyButton.type = 'button';
      copyButton.textContent = 'Copy raw code';
      copyButton.addEventListener('click', () => copyFile(item.path));

      actions.appendChild(openLink);
      actions.appendChild(copyButton);
      card.appendChild(header);
      card.appendChild(frameWrap);
      card.appendChild(actions);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
